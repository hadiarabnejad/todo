{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon</title>
    <link rel="stylesheet" href="{% static 'core_app/bootstrap.min.css' %}" />
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e5e7eb;
        }

        .card {
            width: min(90vw, 720px);
            padding: 48px 32px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(34, 197, 94, 0.5);
            background: rgba(34, 197, 94, 0.08);
            color: #22c55e;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .progress {
            height: 12px;
            margin-top: 28px;
            background: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <span class="badge">Coming Soon</span>
            <h1 class="display-3 fw-bold">Todo App</h1>
            <p class="lead text-secondary mt-3">
                We’re building something useful for your daily tasks. Check back soon for the launch.
            </p>
            <div class="progress mx-auto" style="max-width: 420px;">
                <div class="progress-bar" role="progressbar" style="width: 72%" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
        </div>
    </div>

    <script src="{% static 'core_app/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
