<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --primary: #8b5cf6;
            --accent: #22c55e;
            --text: #e5e7eb;
            --muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--bg), #1e293b);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: min(90vw, 720px);
            padding: 48px 32px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(34, 197, 94, 0.5);
            background: rgba(34, 197, 94, 0.08);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 6vw, 5rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        p {
            color: var(--muted);
            font-size: 1.1rem;
            margin: 20px auto 0;
            max-width: 540px;
            line-height: 1.7;
        }

        .bar {
            margin: 28px auto 0;
            width: min(100%, 420px);
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
        }

        .bar > span {
            display: block;
            width: 72%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #a78bfa);
            border-radius: inherit;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Coming Soon</div>
        <h1>Todo App</h1>
        <p>
            We’re building something useful for your daily tasks. Check back soon for the launch.
        </p>
        <div class="bar"><span></span></div>
    </div>
</body>
</html>
